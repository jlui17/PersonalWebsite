<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Fraunces:opsz,wght@9..144,300..650&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
  body { background: var(--ss-bg); }
  .evo__page { padding: 2rem 0; }
  .variant { padding-top: 3.5rem; }
  .variant > .evo__label { display: block; margin-bottom: 3rem; }
  .stage { position: relative; height: 40px; border-bottom: var(--ss-hairline) solid var(--ss-line-strong); }
  .stage .evo__reacts { position: absolute; right: 0; bottom: 0; }

  /* A robot says hi while the pointer is on it (or after a tap). The bubble is
     the label voice in a hairline box on page colour, anchored to the robot's
     right edge so it grows leftward. Absolute, so nothing around it moves; the
     only motion is a 120ms fade in. The bots' names are lowercase. */
  .evo__reacts { cursor: pointer; }
  .evo__bubble {
    display: none;
    position: absolute;
    right: 0;
    bottom: calc(100% + 7px);
    padding: 0.35rem 0.55rem;
    border: var(--ss-hairline) solid var(--ss-line-strong);
    border-radius: var(--ss-radius-bubble);
    background: var(--ss-bg);
    color: var(--ss-ink);
    line-height: 1.3;
    white-space: nowrap;
    text-transform: none;
    animation: evo-bubble var(--ss-motion-fade) var(--ss-ease-out);
  }
  .evo__reacts:hover .evo__bubble, .is-open .evo__bubble { display: block; }
  .evo__reacts:hover .idle, .is-open .idle { display: none; }
  .evo__reacts .wave { display: none; }
  .evo__reacts:hover .wave, .is-open .wave { display: block; }
  .evo__bubble::before, .evo__bubble::after { content: ""; position: absolute; right: 5px; border: 5px solid transparent; border-bottom: 0; }
  .evo__bubble::before { top: 100%; border-top-color: var(--ss-line-strong); }
  .evo__bubble::after { top: calc(100% - 1px); border-top-color: var(--ss-bg); }
  @keyframes evo-bubble { from { opacity: 0; } }
</style>
</head>
<body>
<main class="evo__page">
  <section class="variant" style="padding-top: 0">
    <span class="evo__label">luibot · open (as on hover)</span>
    <div class="stage">
      <span class="evo__sprite evo__reacts is-open" aria-hidden="true">
        <img class="idle" src="../sprites/luibot-idle-0.svg" width="28" height="32" alt="">
        <img class="wave" src="../sprites/luibot-wave-0.svg" width="28" height="32" alt="">
        <span class="evo__label evo__bubble">Hi, I&rsquo;m luibot</span>
      </span>
    </div>
  </section>
  <section class="variant">
    <span class="evo__label">luibuilder · open (as on hover)</span>
    <div class="stage">
      <span class="evo__sprite evo__reacts is-open" aria-hidden="true">
        <img class="idle" src="../sprites/luibuilder-idle-0.svg" width="30" height="34" alt="">
        <img class="wave" src="../sprites/luibuilder-wave-0.svg" width="30" height="34" alt="">
        <span class="evo__label evo__bubble">Hi, I&rsquo;m luibuilder</span>
      </span>
    </div>
  </section>
  <section class="variant">
    <span class="evo__label">luibot · at rest; hover to open</span>
    <div class="stage">
      <span class="evo__sprite evo__reacts" aria-hidden="true">
        <img class="idle" src="../sprites/luibot-idle-0.svg" width="28" height="32" alt="">
        <img class="wave" src="../sprites/luibot-wave-0.svg" width="28" height="32" alt="">
        <span class="evo__label evo__bubble">Hi, I&rsquo;m luibot</span>
      </span>
    </div>
  </section>
</main>
</body>
</html>
